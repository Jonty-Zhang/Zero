name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check public tree for local data and secrets
        run: node scripts/check-public-tree.mjs
      - name: Install core dependencies
        run: npm ci
      - name: Build and test core
        run: npm test
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build web application
        run: npm --prefix web run build

  windows-guardian:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate MSVC tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere.exe was not found' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC tools were not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) { throw 'vcvars64.bat was not found' }
          "VCVARS=$vcvars" >> $env:GITHUB_ENV
      - name: Build guardian and native tests
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE native\windows-guardian\guardian.cpp /Fe:guardian.exe Advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE native\windows-guardian\tests\guardian_tests.cpp /Fe:guardian_tests.exe Ole32.lib Advapi32.lib
          if errorlevel 1 exit /b 1
      - name: Test guardian process containment
        shell: pwsh
        run: .\guardian_tests.exe (Resolve-Path .\guardian.exe).Path
      - name: Test Windows task installer dry run
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned -File .\scripts\tests\install-windows-task-tests.ps1 -GuardianPath (Resolve-Path .\guardian.exe).Path
      - name: Retain tested guardian executable
        uses: actions/upload-artifact@v4
        with:
          name: zero-windows-guardian
          path: guardian.exe
          if-no-files-found: error
