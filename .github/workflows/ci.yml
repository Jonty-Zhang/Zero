name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check public tree for local data and secrets
        run: node scripts/check-public-tree.mjs
      - name: Install core dependencies
        run: npm ci
      - name: Build and test core
        run: npm test
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build web application
        run: npm --prefix web run build

  windows-guardian:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Locate MSVC tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere.exe was not found' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC tools were not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) { throw 'vcvars64.bat was not found' }
          "VCVARS=$vcvars" >> $env:GITHUB_ENV
      - name: Build guardian and native tests
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE native\windows-guardian\guardian.cpp /Fe:guardian.exe Advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE native\windows-guardian\tests\guardian_tests.cpp /Fe:guardian_tests.exe Ole32.lib Advapi32.lib
          if errorlevel 1 exit /b 1
      - name: Test guardian process containment
        shell: pwsh
        run: .\guardian_tests.exe (Resolve-Path .\guardian.exe).Path
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @('.\scripts\start-zero.ps1', '.\scripts\run-zero.ps1', '.\scripts\uninstall-windows-task.ps1', '.\scripts\tests\windows-installer-smoke.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $script`: $($errors -join '; ')" }
          }
      - name: Retain tested guardian executable
        uses: actions/upload-artifact@v4
        with:
          name: zero-windows-guardian
          path: guardian.exe
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build runtime assets for release staging
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm --prefix web ci
          npm --prefix web run build
      - name: Verify Windows release staging
        shell: pwsh
        run: |
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          $nodeLicense = Join-Path (Split-Path -Parent $nodeExe) 'LICENSE'
          if (-not (Test-Path -LiteralPath $nodeLicense -PathType Leaf)) { throw 'Node distribution LICENSE was not found beside node.exe' }
          node --test scripts/tests/stage-windows-release.test.mjs
          $releaseDir = Join-Path (Get-Location) 'release-stage'
          node scripts/stage-windows-release.mjs --node-exe $nodeExe --node-license $nodeLicense --guardian-exe (Resolve-Path .\guardian.exe).Path --output-dir $releaseDir
          if ($LASTEXITCODE -ne 0) { throw 'Windows release staging failed' }
          node scripts/verify-windows-release.mjs --stage-dir $releaseDir
          if ($LASTEXITCODE -ne 0) { throw 'Windows release verification failed' }
      - name: Retain unsigned Windows release staging files
        uses: actions/upload-artifact@v4
        with:
          name: zero-windows-release-stage-unsigned
          path: release-stage/
          if-no-files-found: error
      - name: Locate runner NSIS compiler and verify version
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $makensis) {
            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
              (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
              'C:\tools\NSIS\makensis.exe'
            )
            $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $makensis) { throw 'NSIS compiler was not found in PATH or standard Windows install locations.' }
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) { throw "Resolved makensis path is not a file: $makensis" }
          $reportedVersion = ((& $makensis /VERSION 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -notmatch '^v?3\.10$') {
            throw "Expected preinstalled NSIS 3.10; makensis reported '$reportedVersion'."
          }
          Write-Output "Using runner-provided NSIS $reportedVersion at $makensis"
          "MAKENSIS=$makensis" >> $env:GITHUB_ENV
      - name: Build verified unsigned Windows installer
        shell: pwsh
        run: |
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          $installer = Join-Path (Get-Location) 'installer-output\Zero-Setup-unsigned.exe'
          .\scripts\package-windows-installer.ps1 -StageDir (Join-Path (Get-Location) 'release-stage') -MakensisPath $env:MAKENSIS -OutputFile $installer -NodePath $nodeExe -ProductVersion '0.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer packaging failed.' }
          "ZERO_INSTALLER=$installer" >> $env:GITHUB_ENV
      - name: Smoke test Windows installer and uninstaller
        shell: pwsh
        run: .\scripts\tests\windows-installer-smoke.ps1 -InstallerPath $env:ZERO_INSTALLER
      - name: Retain unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: zero-windows-installer-unsigned
          path: installer-output/Zero-Setup-unsigned.exe
          if-no-files-found: error
