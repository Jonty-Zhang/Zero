name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check public tree for local data and secrets
        run: node scripts/check-public-tree.mjs
      - name: Install core dependencies
        run: npm ci
      - name: Build and test core
        run: npm test
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build web application
        run: npm --prefix web run build

  windows-guardian:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build guardian and native tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE native\windows-guardian\guardian.cpp /Fe:guardian.exe Advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE native\windows-guardian\tests\guardian_tests.cpp /Fe:guardian_tests.exe Ole32.lib
          if errorlevel 1 exit /b 1
      - name: Test guardian process containment
        shell: pwsh
        run: .\guardian_tests.exe (Resolve-Path .\guardian.exe).Path
